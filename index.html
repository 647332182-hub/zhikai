<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" name="viewport">
  <meta content="yes" name="apple-mobile-web-app-capable">
  <meta content="yes" name="apple-touch-fullscreen">
  <meta content="black" name="apple-mobile-web-app-status-bar-style">
  <meta content="320" name="MobileOptimized">
  <title>页面</title>
  <meta http-equiv="X-DNS-Prefetch-Control" content="off">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#333;background:#f7f7f7;}
.container {
    width: 48px;
    height: 48px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border:4px solid rgba(0,0,0,0.1);
    border-top-color:#2563eb;
    border-radius:50%;
    animation: spin 0.8s linear infinite;
    z-index:10;
}
@keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
}
.content{
    height:100vh;
    width:100vw;
    position: fixed;
    left:0;
    top:0;
    border:none;
    margin:0;
    padding:0;
    z-index:2;
    background:#fff;
}
.tip-text{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    z-index:3;
    color:#666;
    font-size:13px;
}
.error-wrap{
    position:fixed;
    inset:0;
    z-index:99;
    display:none;
    align-items:center;
    justify-content:center;
    background:#f7f7f7;
}
.error-text{
    font-size:16px;
    color:#e53935;
}
</style>
</head>
<body>
<div class="container"></div>
<div class="tip-text">加载中，请稍候...</div>
<div class="error-wrap" id="errorWrap">
    <div class="error-text">目标链接无效，请检查参数</div>
</div>
<script>
function getQuery(name){
    const p=new URLSearchParams(location.search);
    return p.get(name)||'';
}
function safeB64Decode(str){
    if(!str) return '';
    str = str.replace(/-/g,'+').replace(/_/g,'/');
    while(str.length%4) str+='=';
    try{
        return atob(str);
    }catch(e){
        return '';
    }
}
const l = getQuery("l");
const ua = navigator.userAgent.toLowerCase();
const isWx = ua.indexOf('micromessenger') > -1;
const isQQ = ua.indexOf('mqqbrowser') > -1;

function showErrorPage(msg){
    const errWrap = document.getElementById('errorWrap');
    errWrap.querySelector('.error-text').innerText = msg || '目标链接无效';
    errWrap.style.display = "flex";
    document.querySelector(".container").style.display = "none";
    document.querySelector(".tip-text").style.display = "none";
}

function doJump(targetUrl){
    if(!targetUrl || !targetUrl.startsWith('http')){
        showErrorPage('目标链接无效');
        return;
    }
    document.querySelector(".container").style.display = "none";
    document.querySelector(".tip-text").style.display = "none";
    if(isWx || isQQ){
        const iframe = document.createElement('iframe');
        iframe.className = 'content';
        iframe.sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation";
        iframe.src = targetUrl;
        document.body.appendChild(iframe);
    }else{
        window.location.href = targetUrl;
    }
}

(function main(){
    const targetUrl = safeB64Decode(l);
    if(!targetUrl || !targetUrl.startsWith('http')){
        showErrorPage('目标链接无效，请检查l参数');
    }else{
        doJump(targetUrl);
    }
})();
</script>
</body>
</html>
